name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the app runs; Linux also runs the screen regressions. macOS is covered by local runs.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: app/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'app/Directory.Packages.props', 'app/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MPHRegister.sln

      - name: Build (warnings are errors)
        run: dotnet build MPHRegister.sln --no-restore

      - name: Unit and API tests
        run: dotnet test MPHRegister.sln --no-build

      # The screens (src/frontend) are plain JavaScript embedded in the exe; a syntax error would only show when the app runs.
      - name: Screen and end-to-end scripts parse
        if: runner.os == 'Linux'
        run: for f in $(find src/frontend -name '*.js') tests/e2e/*.js tests/e2e/*.mjs; do node --check "$f" || exit 1; done

      - name: Hinglish translations and locale round trips
        run: node tests/e2e/i18n-test.js

  screen-regressions:
    name: Screen regressions (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MPH_PORT: 5160
      MPH_BASE_URL: http://127.0.0.1:5160
      MPH_DATA_DIR: ${{ runner.temp }}/mph-register-shard-${{ matrix.shard }}
      MPH_NO_BROWSER: 1
      MPH_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: app/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'app/Directory.Packages.props', 'app/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/backend/MPHRegister.Api/MPHRegister.Api.csproj

      - name: Build app
        run: dotnet build src/backend/MPHRegister.Api/MPHRegister.Api.csproj --no-restore

      - name: Install browser
        working-directory: app/tests/e2e
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Run shard
        run: sh tests/e2e/run-ci-shard.sh '${{ matrix.shard }}'

  # The real Windows app updating itself: 0.0.1 downloads 0.0.2 from a release served on the runner, closes and returns,
  # then goes back to 0.0.1 over a (made-up) data format change.
  self-update:
    name: Windows app updates itself
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: app/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-publish-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'app/Directory.Packages.props', 'app/global.json') }}
          restore-keys: nuget-publish-${{ runner.os }}-

      - name: Install 0.0.1, update it to 0.0.2, go back to 0.0.1
        run: sh scripts/test-self-update.sh

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.6.8

      - name: Lint JavaScript
        run: biome lint --error-on-warnings

      - name: Lint Python
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
          args: check app/tools app/tests/e2e scripts

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh .githooks/*

  privacy:
    name: No real data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The generic rules only: the private terms live on the developer's machine (scripts/privacy_check.py).
      - name: Privacy checker regressions
        run: python3 -m unittest discover -s scripts -p 'test_privacy_check.py'

      - name: Every file holds test data only
        run: python3 scripts/privacy_check.py

      - name: Every commit of the pull request holds test data only
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/privacy_check.py --commits "$BASE..$HEAD"

      - name: Pull request title and description hold test data only
        if: github.event_name == 'pull_request'
        env:
          TEXT: "${{ github.event.pull_request.title }}\n${{ github.event.pull_request.body }}"
        run: python3 scripts/privacy_check.py --text "$TEXT"
